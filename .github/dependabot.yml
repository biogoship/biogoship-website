version: 2
updates:
  # npm packages. Minor and patch bumps are grouped into a single weekly PR so a
  # routine week is one review instead of a dozen. Major bumps are deliberately
  # left out of the group: they can contain breaking changes and deserve their
  # own PR and their own build check.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'deps'

  # The versions pinned in .github/workflows/deploy.yml (actions/checkout etc.).
  # These rarely change, and a stale action is a supply-chain risk, so keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
