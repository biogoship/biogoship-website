# Pages CMS reads this from the repository root.
# Keep this file next to package.json (the Astro project).
media:
  - name: images
    label: Images
    input: src/images/content
    output: '@images/content'
  - name: documents
    label: Documents
    input: public/data/protocols
    output: /data/protocols
    extensions: [pdf, doc, docx]
# Hide the sidebar Media library. Uploads still work from image/file fields
# on a post, cruise, team member, or protocol. An empty list is required —
# omitting this key would show Images and Documents in the sidebar again.
navigation:
  media: []
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/articles/en
    format: yaml-frontmatter
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      primary: title
      sort: publishDate
      order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: publishDate
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: excerpt
        type: text
      - name: author
        type: object
        fields:
          - name: name
            type: string
          - name: url
            type: string
      - name: draft
        type: boolean
      - name: featured
        type: boolean
      - name: categories
        label: Categories
        type: reference
        description: Colored pills on the post and the filter row on /posts. Add a new one under Post categories in the left sidebar first, then select it here. Example New Publication or P15S.
        options:
          collection: post-categories
          multiple: true
          search: "slug,title,fields.slug,fields.title"
          value: "{primary}"
          label: "{fields.title}"
      - name: tags
        label: Tags
        type: reference
        description: Small grey keywords under the post. Add a new one under Post tags in the left sidebar first, then select it here.
        options:
          collection: post-tags
          multiple: true
          search: "slug,title,fields.slug,fields.title"
          value: "{primary}"
          label: "{fields.title}"
      - name: image
        type: object
        fields:
          - name: file
            type: image
            options:
              media: images
              path: src/images/content/posts
          - name: alt
            type: string
          - name: size
            label: Image size
            type: select
            description: Makes the photo Small, Medium, or Large on the post. You can change it later.
            options:
              values:
                - name: small
                  label: Small
                - name: medium
                  label: Medium
                - name: large
                  label: Large
      - name: body
        type: rich-text

  - name: post-categories
    label: Post categories
    type: collection
    path: src/content/post-categories
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: slug
    fields:
      - name: slug
        label: ID
        type: string
        required: true
        pattern: '^[a-z0-9-]+$'
        description: Lowercase with dashes. Used in URLs and on posts, e.g. p15s. Do not change it after posts already use it.
      - name: title
        label: Display name
        type: string
        required: true
        description: What visitors see on the colored pills, e.g. P15S.
      - name: color
        label: Color
        type: select
        required: true
        description: Pill color on Posts. Cruise lines can share Site lime. Duplicates are fine. Hex is in the name so you can see it without a color wheel.
        options:
          values:
            - name: '282687'
              label: 'Site navy (#282687)'
            - name: '141346'
              label: 'Deep midnight (#141346)'
            - name: '1a5f9e'
              label: 'Ocean blue (#1a5f9e)'
            - name: '017aa3'
              label: 'Coastal cyan (#017aa3)'
            - name: '01a8df'
              label: 'Bright sea (#01a8df)'
            - name: '0d7377'
              label: 'Teal (#0d7377)'
            - name: '1b7a4e'
              label: 'Kelp (#1b7a4e)'
            - name: 'a2d12d'
              label: 'Site lime (#a2d12d)'
            - name: '6b9a1e'
              label: 'Moss (#6b9a1e)'
            - name: 'c9a227'
              label: 'Sand (#c9a227)'
            - name: 'b85c4c'
              label: 'Coral (#b85c4c)'

  - name: post-tags
    label: Post tags
    type: collection
    path: src/content/post-tags
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: slug
    fields:
      - name: slug
        label: ID
        type: string
        required: true
        pattern: '^[a-z0-9-]+$'
        description: Lowercase with dashes. Used in URLs and on posts, e.g. indian-ocean. Do not change it after posts already use it.
      - name: title
        label: Display name
        type: string
        required: true
        description: Small keyword under the post, e.g. Indian Ocean.

  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      sort: year
      order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: authors
        type: string
        required: true
      - name: year
        type: number
      - name: source
        type: string
      - name: doi
        type: string
      - name: url
        type: string
      - name: draft
        type: boolean
      - name: body
        type: rich-text

  - name: cruises
    label: Cruises
    type: collection
    path: src/content/cruises
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        options:
          format: yyyy-MM-dd
      - name: caption
        type: text
      - name: draft
        type: boolean
      - name: image
        type: object
        fields:
          - name: file
            type: image
            options:
              media: images
              path: src/images/content/cruises
          - name: alt
            type: string
      - name: map
        label: Map
        type: object
        fields:
          - name: points
            label: Pins
            description: Optional station or port markers. Latitude and longitude in decimal degrees (negative for south / west).
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} ({lat}, {lng})"
            fields:
              - name: lat
                label: Latitude
                type: number
                required: true
              - name: lng
                label: Longitude
                type: number
                required: true
              - name: title
                label: Label
                type: string
          - name: line
            label: Cruise line
            description: Ordered points that draw the cruise track. Add them in order along the line (start, then waypoints, then end).
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{index}: {lat}, {lng}"
            fields:
              - name: lat
                label: Latitude
                type: number
                required: true
              - name: lng
                label: Longitude
                type: number
                required: true
      - name: body
        type: rich-text

  - name: team
    label: Team
    type: collection
    path: src/content/team
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: name
    fields:
      - name: name
        type: string
        required: true
      - name: role
        type: string
      - name: affiliation
        type: string
      - name: group
        label: Team
        type: select
        required: true
        options:
          values:
            - name: usa
              label: USA
            - name: international
              label: International
      - name: order
        type: number
      - name: draft
        type: boolean
      - name: photo
        type: object
        fields:
          - name: file
            type: image
            options:
              media: images
              path: src/images/content/headshots
          - name: alt
            type: string
      - name: body
        type: rich-text

  - name: protocols
    label: Protocols
    type: collection
    path: src/content/protocols
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      sort: publishDate
      order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: category
        type: string
        required: true
      - name: file
        label: Protocol file
        type: file
        options:
          media: documents
          path: public/data/protocols
          extensions: [pdf, doc, docx]
      - name: url
        label: External file URL
        type: string
        description: Use this if the PDF or Word file is hosted elsewhere instead of uploaded here.
      - name: publishDate
        type: date
        options:
          format: yyyy-MM-dd
      - name: updateDate
        type: date
        options:
          format: yyyy-MM-dd
      - name: draft
        type: boolean
      - name: body
        type: rich-text

  - name: carousel
    label: Homepage photos
    type: collection
    path: src/content/carousel
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      sort: order
    fields:
      - name: title
        type: string
        required: true
        description: Label in the CMS only. Visitors do not see this.
      - name: alt
        label: Alt text
        type: string
        required: true
        description: Describe the photo. Used by screen readers.
      - name: order
        type: number
        description: Lower numbers list first. The homepage still shuffles on each visit.
      - name: draft
        type: boolean
      - name: image
        type: object
        fields:
          - name: file
            type: image
            required: true
            options:
              media: images
              path: src/images/content/carousel

  - name: faq
    label: FAQ
    type: collection
    path: src/content/faq-answers/en
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: question
    fields:
      - name: question
        type: string
        required: true
      - name: category
        type: string
      - name: draft
        type: boolean
      - name: body
        type: rich-text
